<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyze — Rayzoai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FFFFFF;
    --bg-2: #F7F6F3;
    --bg-3: #EEECEA;
    --border: rgba(26,25,23,0.09);
    --border-hover: rgba(26,25,23,0.18);
    --accent: #1D9E75;
    --accent-dim: rgba(29,158,117,0.10);
    --accent-glow: rgba(29,158,117,0.25);
    --text: #1A1917;
    --text-2: rgba(26,25,23,0.62);
    --text-3: rgba(26,25,23,0.40);
    --radius: 12px;
    --radius-lg: 20px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0D2B1F;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ─── NAVBAR ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 64px;
    background: #0D2B1F;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #FFFFFF;
  }

  .logo-mark {
    width: 30px;
    height: 30px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .logo-mark::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2.5px solid white;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 2s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-text {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #FFFFFF;
  }

  .back-link {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 8px;
    transition: color 0.2s, background 0.2s;
  }

  .back-link:hover {
    color: #FFFFFF;
    background: rgba(255,255,255,0.08);
  }

  /* ─── MAIN ─── */
  .main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 40px 80px;
    position: relative;
    overflow: hidden;
  }

  .main-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    width: 800px;
    height: 500px;
    background: radial-gradient(ellipse at center, rgba(29,158,117,0.20) 0%, transparent 70%);
    pointer-events: none;
  }

  .main-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    pointer-events: none;
  }

  .analyze-container {
    width: 100%;
    position: relative;
    z-index: 1;
  }

  .analyze-heading {
    text-align: center;
    margin-bottom: 40px;
  }

  .analyze-heading h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.15;
    color: #FFFFFF;
    margin-bottom: 12px;
  }

  .analyze-heading h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--accent), #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .analyze-heading p {
    font-size: 16px;
    color: rgba(255,255,255,0.55);
    line-height: 1.6;
  }

  .container {
    width: 100%;
  }

  /* ─── ANALYZE FORM ─── */
  .analyze-form {
    display: flex;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto 20px;
    position: relative;
    z-index: 1;
  }

  .analyze-input {
    flex: 1;
    min-width: 0;
    padding: 14px 18px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: var(--radius);
    color: #FFFFFF;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .analyze-input::placeholder { color: rgba(255,255,255,0.35); }

  .analyze-input:focus {
    border-color: rgba(29,158,117,0.65);
    background: rgba(29,158,117,0.06);
  }

  .analyze-input.input-error { border-color: #f87171 !important; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius);
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 0 0 0 var(--accent-glow);
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(29,158,117,0.35);
    opacity: 0.92;
  }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    flex-shrink: 0;
  }

  /* ─── LOADING STATUS ─── */
  .analyze-status {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    position: relative;
    z-index: 1;
    min-height: 20px;
  }

  .badge-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .search-hint {
    font-size: 12px;
    color: rgba(255,255,255,0.38);
    text-align: center;
    position: relative;
    z-index: 1;
    margin-top: -12px;
    margin-bottom: 20px;
  }

  .cta-fine {
    font-size: 13px;
    color: rgba(255,255,255,0.38);
    text-align: center;
    position: relative;
    z-index: 1;
    margin-top: 12px;
  }

  .cta-fine span { color: var(--accent); }

  /* ─── RESULTS ─── */
  #results-section {
    padding: 52px 40px 0;
    width: 100%;
  }

  .results-wrap {
    max-width: 100%;
    margin: 0 auto;
    text-align: left;
    animation: resultsIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
    --text:         #1A1917;
    --text-2:       rgba(26,25,23,0.65);
    --text-3:       rgba(26,25,23,0.42);
    --bg-2:         #F8F8F7;
    --bg-3:         #F1F1F0;
    --border:       rgba(26,25,23,0.09);
    --border-hover: rgba(26,25,23,0.18);
    color: #1A1917;
    background: #F7F6F3;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 12px 64px rgba(0,0,0,0.24), 0 2px 8px rgba(0,0,0,0.10);
    border-top: 1px solid rgba(255,255,255,0.10);
  }

  @keyframes resultsIn {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .results-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }

  .results-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }

  .results-meta { font-size: 12px; color: var(--text-3); }

  .result-cat {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--bg-2);
    padding: 20px;
    margin-bottom: 10px;
    transition: border-color 0.25s, transform 0.25s, background 0.25s, box-shadow 0.25s, opacity 0.2s;
  }

  .result-cat:hover {
    border-color: rgba(29,158,117,0.28);
    transform: translateX(4px);
    background: #FFFFFF;
    box-shadow: 0 2px 16px rgba(0,0,0,0.05);
  }

  .result-cat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .result-cat-name {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .result-cat-nums { text-align: right; line-height: 1.2; }

  .result-count { font-size: 22px; font-weight: 700; }

  .result-pct { font-size: 12px; color: var(--text-3); }

  .result-bar-track {
    height: 5px;
    background: rgba(26,25,23,0.08);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .result-bar-fill {
    height: 100%;
    border-radius: 100px;
    background: var(--accent);
    width: 0;
    animation: grow 1.1s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes grow { to { width: var(--w); } }

  .quotes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .quote {
    background: rgba(26,25,23,0.03);
    border: 1px solid rgba(26,25,23,0.07);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.6;
  }

  .quote-reviewer {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    display: block;
    margin-bottom: 3px;
  }

  .quote-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 6px;
  }

  .quote-stars {
    color: #ef4444;
    font-size: 11px;
    letter-spacing: 0.5px;
  }

  .quote-date {
    font-size: 11px;
    color: var(--text-3);
  }

  .quote-text {
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.55;
  }

  /* ─── ERROR STATE ─── */
  .error-box {
    padding: 40px 24px;
    text-align: center;
    color: var(--text-2);
  }

  .error-box-icon { font-size: 36px; margin-bottom: 16px; }
  .error-box-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .error-box-desc { font-size: 14px; line-height: 1.6; }
  .error-box-hint { font-size: 12px; color: var(--text-3); margin-top: 10px; }

  /* ─── RESULT TABS ─── */
  .result-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .result-tab {
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid rgba(26,25,23,0.11);
    background: #FFFFFF;
    color: rgba(26,25,23,0.55);
    font-family: inherit;
    line-height: 1;
    transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  .result-tab:hover:not(.active) {
    border-color: rgba(29,158,117,0.45);
    color: #1D9E75;
    background: rgba(29,158,117,0.06);
  }

  .result-tab.active {
    background: #1D9E75;
    border-color: #1D9E75;
    color: #FFFFFF;
    font-weight: 600;
    box-shadow: 0 2px 12px rgba(29,158,117,0.28);
  }

  /* ─── PRIORITY CHART ─── */
  .priority-chart {
    margin-bottom: 24px;
    padding: 18px 20px;
    background: rgba(26,25,23,0.03);
    border: 1px solid rgba(26,25,23,0.07);
    border-radius: 14px;
  }

  .priority-chart-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(26,25,23,0.42);
    margin-bottom: 14px;
  }

  .priority-bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .priority-bar-row:last-child { margin-bottom: 0; }

  .priority-bar-label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(26,25,23,0.72);
    width: 140px;
    flex-shrink: 0;
  }

  .priority-bar-track {
    flex: 1;
    height: 8px;
    background: rgba(26,25,23,0.07);
    border-radius: 100px;
    overflow: hidden;
  }

  .priority-bar-fill {
    height: 100%;
    border-radius: 100px;
    width: 0;
    animation: grow 1s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .priority-bar-pct {
    font-size: 13px;
    font-weight: 600;
    color: rgba(26,25,23,0.52);
    width: 34px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ─── RESULT CATEGORIES GRID ─── */
  .result-cats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .result-cats-grid .result-cat {
    margin-bottom: 0;
  }

  /* ─── DEMO TAGS ─── */
  .demo-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 8px;
  }

  .tag-critical { background: rgba(239,68,68,0.10); color: #dc2626; }
  .tag-high     { background: rgba(234,88,12,0.10); color: #ea580c; }
  .tag-medium   { background: rgba(202,138,4,0.10);  color: #a16207; }

  .revenue-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .revenue-label { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .revenue-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .revenue-badge-high   { background: #fee2e2; color: #dc2626; }
  .revenue-badge-medium { background: #ffedd5; color: #ea580c; }
  .revenue-badge-low    { background: #f3f4f6; color: #6b7280; }
  .revenue-reason { font-size: 13px; color: #666; font-style: italic; margin-bottom: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ─── FILTER ROW ─── */
  .filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 560px;
    margin: 0 auto 14px;
    position: relative;
    z-index: 1;
    gap: 10px;
  }

  .platform-filters {
    display: flex;
    gap: 6px;
  }

  .platform-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.18);
    background: transparent;
    color: rgba(255,255,255,0.55);
    transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
    line-height: 1;
    white-space: nowrap;
  }

  .platform-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
    font-weight: 600;
    box-shadow: 0 2px 12px rgba(29,158,117,0.35);
  }

  .platform-btn[disabled] {
    opacity: 0.42;
    cursor: not-allowed;
    pointer-events: none;
  }

  .soon-badge {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(255,255,255,0.14);
    border-radius: 100px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: rgba(255,255,255,0.60);
    line-height: 1.6;
  }

  .time-select {
    padding: 7px 30px 7px 14px;
    background: rgba(255,255,255,0.09);
    border: 1.5px solid rgba(255,255,255,0.14);
    border-radius: 100px;
    color: rgba(255,255,255,0.78);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    outline: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='rgba%28255%2C255%2C255%2C0.5%29' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    transition: border-color 0.2s;
    white-space: nowrap;
  }

  .time-select:focus { border-color: rgba(29,158,117,0.65); }

  .time-select option { background: #0D2B1F; color: #FFFFFF; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .main { padding: 90px 20px 60px; }
  }

  @media (max-width: 680px) {
    .result-cats-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 600px) {
    .analyze-form { flex-direction: column; }
    .results-wrap { padding: 24px 20px; border-radius: 16px; }
    #results-section { padding-top: 40px; }
    .result-tab { padding: 6px 12px; font-size: 12px; }
    .priority-bar-label { width: 108px; font-size: 12px; }
    .priority-bar-pct { width: 30px; font-size: 12px; }
  }

  @media (max-width: 480px) {
    .filter-row { flex-wrap: wrap; }
    .time-select { flex: 1; }
    .analyze-heading h1 { font-size: 26px; letter-spacing: -1px; }
  }

  /* ─── ACTION PLAN ─── */
  .action-plan {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .action-plan-header {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 16px;
    color: var(--text);
  }

  .action-plan-item {
    background: #FFFFFF;
    border-radius: var(--radius);
    border-left: 4px solid #10b981;
    padding: 18px 20px;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  }

  .action-plan-item:last-child { margin-bottom: 0; }

  .action-plan-item-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .action-plan-cat-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .action-plan-fix-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #10b981;
    margin-bottom: 6px;
  }

  .action-plan-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.65;
    margin: 0;
  }
</style>
</head>
<body>

<!-- ── NAVBAR ── -->
<nav>
  <a href="index.html" class="logo">
    <div class="logo-mark"></div>
    <span class="logo-text">Rayzoai</span>
  </a>
  <a href="index.html" class="back-link">← Back to home</a>
</nav>

<!-- ── MAIN ── -->
<main class="main">
  <div class="main-glow"></div>
  <div class="main-grid"></div>

  <div class="analyze-container">
    <div class="analyze-heading">
      <h1>Analyze any app's<br><em>reviews instantly.</em></h1>
      <p>Paste a Google Play URL or search by app name — get a ranked fix list in under 60 seconds.</p>
    </div>

    <div class="container">
      <div class="filter-row">
        <div class="platform-filters">
          <button class="platform-btn active" id="platform-gplay">
            <svg width="12" height="13" viewBox="0 0 12 13" fill="none">
              <path d="M1 1.5L7 6.5L1 11.5V1.5Z" fill="currentColor"/>
              <path d="M1 1.5L9.5 4.5L7 6.5L1 1.5Z" fill="currentColor" opacity="0.75"/>
              <path d="M1 11.5L7 6.5L9.5 8.5L1 11.5Z" fill="currentColor" opacity="0.75"/>
              <path d="M9.5 4.5L11 5.5L10 7L9.5 8.5L7 6.5L9.5 4.5Z" fill="currentColor" opacity="0.55"/>
            </svg>
            Google Play
          </button>
          <button class="platform-btn" id="platform-appstore" disabled>
            <svg width="12" height="13" viewBox="0 0 12 13" fill="none">
              <path d="M6 1.5C6 1.5 4.5 2.8 4.5 3.8C4.5 4.5 5.1 5 6 5C6.9 5 7.5 4.5 7.5 3.8C7.5 2.8 6 1.5 6 1.5Z" fill="currentColor"/>
              <path d="M2 11.5L3.8 7.5H8.2L10 11.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M3.8 7.5L6 4L8.2 7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            App Store
            <span class="soon-badge">Soon</span>
          </button>
        </div>

        <select class="time-select" id="time-range">
          <option value="2w">Last 2 weeks</option>
          <option value="1m" selected>Last month</option>
          <option value="3m">Last 3 months</option>
        </select>
      </div>

      <div class="analyze-form">
        <input
          type="text"
          id="app-input"
          class="analyze-input"
          placeholder="App name or Google Play URL"
          autocomplete="off"
        />
        <button id="analyze-btn" class="btn-primary" onclick="analyzeApp()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 1.5L14 8L8 14.5M2 8H14" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Analyze
        </button>
      </div>
      <p class="search-hint">Search by app name or paste a Google Play URL</p>
      <div id="analyze-status" class="analyze-status" style="display:none;">
        <div class="badge-dot" style="flex-shrink:0;width:6px;height:6px;"></div>
        <span id="analyze-status-text"></span>
      </div>
      <p class="cta-fine">No credit card &nbsp;·&nbsp; No account needed &nbsp;·&nbsp; <span>Results in &lt; 60 seconds</span></p>
      <div id="results-section" style="display:none;"></div>
    </div>
  </div>
</main>

<script>
  const ANALYZE_BTN_DEFAULT = `
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M8 1.5L14 8L8 14.5M2 8H14" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Analyze`;

  const LOADING_STEPS_SEARCH = [
    'Searching Google Play…',
    'Fetching negative reviews…',
    'Running AI analysis…',
    'Almost done…'
  ];

  const LOADING_STEPS_URL = [
    'Fetching reviews…',
    'Running AI analysis…',
    'Almost done…'
  ];

  let _loadingTimer = null;

  function startLoadingSteps(isUrl = false) {
    const steps = isUrl ? LOADING_STEPS_URL : LOADING_STEPS_SEARCH;
    const wrap = document.getElementById('analyze-status');
    const text = document.getElementById('analyze-status-text');
    wrap.style.display = 'flex';
    text.textContent = steps[0];
    let step = 1;
    _loadingTimer = setInterval(() => {
      if (step < steps.length) {
        text.textContent = steps[step++];
      }
    }, 3500);
  }

  function stopLoadingSteps() {
    clearInterval(_loadingTimer);
    document.getElementById('analyze-status').style.display = 'none';
  }

  function extractPlayStoreId(raw) {
    try {
      const url = new URL(raw);
      if (url.hostname === 'play.google.com') {
        return url.searchParams.get('id') || null;
      }
    } catch (_) {}
    return null;
  }

  async function analyzeApp() {
    const input    = document.getElementById('app-input');
    const btn      = document.getElementById('analyze-btn');
    const results  = document.getElementById('results-section');
    const rawInput = input.value.trim();

    if (!rawInput) {
      input.classList.add('input-error');
      input.focus();
      setTimeout(() => input.classList.remove('input-error'), 1200);
      return;
    }

    const appId   = extractPlayStoreId(rawInput);
    const appName = appId ? null : rawInput;
    const isUrl   = !!appId;

    btn.disabled  = true;
    btn.innerHTML = '<div class="spinner"></div> Analyzing…';
    results.style.display = 'none';
    startLoadingSteps(isUrl);

    const timeRange = document.getElementById('time-range').value;

    let data = null;
    let isLive = false;
    let fatalError = false;
    let demoNotice = false;
    let errorMessage = 'Our server is warming up. Please try again in 30 seconds.';

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      const payload = isUrl ? { appId, timeRange } : { appName, timeRange };
      const res = await fetch('https://rayzoai-app-production.up.railway.app/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (res.ok) {
        data = await res.json();
        isLive = true;
      } else if (res.status === 404) {
        data = generateDemoData(isUrl ? appId : appName);
        demoNotice = true;
      } else {
        fatalError = true;
      }
    } catch (err) {
      fatalError = true;
      if (err.name === 'AbortError') errorMessage = 'Request timed out. Please try again — the server may be warming up.';
    }

    stopLoadingSteps();
    btn.disabled  = false;
    btn.innerHTML = ANALYZE_BTN_DEFAULT;

    if (fatalError) {
      results.innerHTML = `
        <div class="results-wrap">
          <div class="error-box">
            <div class="error-box-icon">⏳</div>
            <div class="error-box-title">Analysis temporarily unavailable</div>
            <div class="error-box-desc">${errorMessage}</div>
            <div style="margin-top:20px;">
              <button class="btn-primary" onclick="analyzeApp()">Try Again</button>
            </div>
          </div>
        </div>`;
      results.style.display = 'block';
    } else {
      renderResults(isUrl ? appId : appName, data, results, isLive, demoNotice);
    }

    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function generateDemoData(appName) {
    const seed  = [...appName].reduce((a, c) => (Math.imul(a, 31) + c.charCodeAt(0)) | 0, 7);
    const abs   = n => Math.abs(n);
    const total = 900 + abs(seed % 1200);

    const crashPct = 28 + abs((seed * 3)  % 18);
    const uxPct    = 18 + abs((seed * 7)  % 14);
    const perfPct  = 13 + abs((seed * 11) % 12);
    const pricePct =  7 + abs((seed * 17) %  9);
    const n = pct  => Math.round(total * pct / 100);

    const crashPool = [
      [`"${appName} crashes every time I open a new session — reinstalled twice, still broken."`,
       `"App freezes on the checkout screen. Lost my order twice because of this bug."`],
      [`"Crashes instantly on the latest update. One star until this is fixed."`,
       `"Randomly closes in the middle of a recording. Lost 20 minutes of work."`],
      [`"Getting a black-screen crash every morning when I launch ${appName}."`,
       `"Can't get past the login screen without a force-close. Very frustrating."`],
    ];
    const uxPool = [
      [`"The redesign is so confusing — I can't find settings I used every day."`,
       `"Why is the search bar hidden now? Took me 10 minutes to find the new layout."`],
      [`"New navigation makes no sense. Three taps to do what used to take one."`,
       `"Onboarding is so long I almost quit before even using the app."`],
      [`"Buttons are too small, keep tapping the wrong thing on my phone."`,
       `"Dark-mode contrast is really hard to read on the new card design."`],
    ];
    const perfPool = [
      [`"Takes 12 seconds to load on my brand-new phone. Completely unacceptable."`,
       `"${appName} drains my battery in under 3 hours. Had to stop using it."`],
      [`"So laggy when scrolling the feed. Felt instant 6 months ago."`,
       `"Videos buffer for 30 seconds even on WiFi — every other app is fine."`],
      [`"2 GB cache after one week of use? Please add a clear-cache option."`,
       `"Network requests time out constantly. Everything takes forever."`],
    ];
    const pricePool = [
      [`"Used to be free. Now they want $9.99/month for features I already had."`,
       `"Prices went up again with zero new features. Switching to a competitor."`],
      [`"The 'free' tier is basically unusable — feels designed to force a subscription."`,
       `"Paid for annual, then they changed what's included. Feels dishonest."`],
      [`"Not worth the price compared to competitors charging half as much."`,
       `"Cancelled my sub — too expensive when bugs are still this bad."`],
    ];

    const pick = arr => arr[abs(seed) % arr.length];

    return {
      totalReviews: total,
      categories: [
        { name: 'Crashes & Bugs',     count: n(crashPct), pct: crashPct, tag: 'Critical', tagClass: 'tag-critical', quotes: pick(crashPool) },
        { name: 'UX Issues',          count: n(uxPct),    pct: uxPct,    tag: 'High',     tagClass: 'tag-high',     quotes: pick(uxPool)    },
        { name: 'Performance',        count: n(perfPct),  pct: perfPct,  tag: 'High',     tagClass: 'tag-high',     quotes: pick(perfPool)  },
        { name: 'Pricing Complaints', count: n(pricePct), pct: pricePct, tag: 'Medium',   tagClass: 'tag-medium',   quotes: pick(pricePool) },
      ]
    };
  }

  function renderResults(appName, data, container, isLive, demoNotice = false) {
    const { totalReviews, categories, appTitle } = data;
    const displayName = appTitle || appName;

    if (!categories || categories.length === 0) {
      container.innerHTML = `
        <div class="results-wrap">
          <div class="results-head">
            <div>
              <div class="results-title">Analysis for &ldquo;${displayName}&rdquo;</div>
              <div class="results-meta">No 1–2 star reviews found in recent results</div>
            </div>
            <span class="demo-tag" style="background:rgba(29,158,117,0.12);color:#1D9E75;border:1px solid rgba(29,158,117,0.25);flex-shrink:0;align-self:flex-start;">Live Data</span>
          </div>
          <p style="color:var(--text-2);font-size:14px;padding:20px 0 4px;">Great news — no significant negative feedback found in recent reviews!</p>
        </div>`;
      container.style.display = 'block';
      return;
    }

    const maxPct = Math.max(...categories.map(c => c.pct));

    const badgeHTML = isLive
      ? `<span class="demo-tag" style="background:rgba(29,158,117,0.12);color:#1D9E75;border:1px solid rgba(29,158,117,0.25);flex-shrink:0;align-self:flex-start;">Live Data</span>`
      : `<span class="demo-tag tag-medium" style="flex-shrink:0;align-self:flex-start;">Demo</span>`;

    const metaText = isLive
      ? `Based on ${totalReviews.toLocaleString()} real negative reviews &nbsp;&middot;&nbsp; Top feedback themes`
      : `Based on ${totalReviews.toLocaleString()} simulated reviews &nbsp;&middot;&nbsp; Top negative feedback themes`;

    const revenueImpactBadge = level => {
      if (!level) return '';
      const cls = { High: 'revenue-badge-high', Medium: 'revenue-badge-medium', Low: 'revenue-badge-low' }[level] || 'revenue-badge-low';
      return `<span class="revenue-badge ${cls}">${level}</span>`;
    };

    const catsHTML = categories.map(cat => `
      <div class="result-cat" data-category="${cat.name}">
        <div class="result-cat-top">
          <span class="result-cat-name">
            ${cat.name}
            <span class="demo-tag ${cat.tagClass}">${cat.tag}</span>
          </span>
          <div class="result-cat-nums">
            <div class="result-count">${cat.count.toLocaleString()}</div>
            <div class="result-pct">${cat.pct}% of reviews</div>
          </div>
        </div>
        ${cat.revenueImpact ? `
        <div class="revenue-row">
          <span class="revenue-label">Revenue impact:</span>
          ${revenueImpactBadge(cat.revenueImpact)}
        </div>
        ${cat.revenueReason ? `<p class="revenue-reason">${cat.revenueReason}</p>` : ''}
        ` : ''}
        <div class="result-bar-track">
          <div class="result-bar-fill" style="--w:${Math.round(cat.pct / maxPct * 90)}%"></div>
        </div>
        <div class="quotes">
          ${(cat.quotes || []).map(q => {
            const _names = ['User', 'Android User', 'Google User'];
            const _dates = ['2 days ago', '1 week ago', '3 weeks ago', 'last month'];
            const _name = _names[Math.floor(Math.random() * _names.length)];
            const _date = _dates[Math.floor(Math.random() * _dates.length)];
            const _stars = Math.random() < 0.5 ? '★☆☆☆☆' : '★★☆☆☆';
            return `<div class="quote"><span class="quote-reviewer">${_name}</span><div class="quote-meta"><span class="quote-stars">${_stars}</span><span class="quote-date">· ${_date}</span></div><div class="quote-text">${q}</div></div>`;
          }).join('')}
        </div>
      </div>`
    ).join('');

    const tabsHTML = `
      <div class="result-tabs">
        <button class="result-tab active" onclick="switchResultTab('All', this)">All</button>
        ${categories.map(cat => `<button class="result-tab" onclick="switchResultTab('${cat.name}', this)">${cat.name}</button>`).join('')}
      </div>`;

    const barColorMap = { 'tag-critical': '#ef4444', 'tag-high': '#f97316', 'tag-medium': '#eab308' };
    const chartHTML = `
      <div class="priority-chart">
        <div class="priority-chart-title">Issues by priority</div>
        ${categories.map((cat, i) => {
          const color = barColorMap[cat.tagClass] || '#1D9E75';
          return `
            <div class="priority-bar-row">
              <span class="priority-bar-label">${cat.name}</span>
              <div class="priority-bar-track">
                <div class="priority-bar-fill" style="--w:${cat.pct}%;background:${color};animation-delay:${i * 120}ms;"></div>
              </div>
              <span class="priority-bar-pct">${cat.pct}%</span>
            </div>`;
        }).join('')}
      </div>`;

    const noticeHTML = demoNotice
      ? `<div style="margin-bottom:20px;padding:10px 14px;background:rgba(202,138,4,0.08);border:1px solid rgba(202,138,4,0.20);border-radius:10px;font-size:13px;color:#a16207;">⚠️ Showing example data — enter a real app URL for live results.</div>`
      : '';

    const actionPlanHTML = isLive && categories.some(c => c.recommendation) ? `
      <div class="action-plan">
        <div class="action-plan-header">🎯 Your Action Plan</div>
        ${categories.filter(c => c.recommendation).map(cat => `
          <div class="action-plan-item">
            <div class="action-plan-item-top">
              <span class="action-plan-cat-name">${cat.name}</span>
              <span class="demo-tag ${cat.tagClass}">${cat.tag}</span>
            </div>
            <div class="action-plan-fix-label">Recommended Fix</div>
            <p class="action-plan-text">${cat.recommendation}</p>
          </div>`).join('')}
      </div>` : '';

    container.innerHTML = `
      <div class="results-wrap">
        <div class="results-head">
          <div>
            <div class="results-title">Analysis for &ldquo;${displayName}&rdquo;</div>
            <div class="results-meta">${metaText}</div>
          </div>
          ${badgeHTML}
        </div>
        ${noticeHTML}
        ${chartHTML}
        ${tabsHTML}
        <div class="result-cats-grid">
          ${catsHTML}
        </div>
        ${actionPlanHTML}
      </div>`;

    container.style.display = 'block';
  }

  function switchResultTab(tabName, el) {
    document.querySelectorAll('.result-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');

    const cats = document.querySelectorAll('.result-cat');
    cats.forEach(cat => { cat.style.opacity = '0'; });

    setTimeout(() => {
      cats.forEach(cat => {
        const show = tabName === 'All' || cat.dataset.category === tabName;
        cat.style.display = show ? '' : 'none';
      });
      requestAnimationFrame(() => {
        cats.forEach(cat => {
          if (cat.style.display !== 'none') cat.style.opacity = '1';
        });
      });
    }, 180);
  }

  document.getElementById('app-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') analyzeApp();
  });
</script>
</body>
</html>
