<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rayzoai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #1D9E75;
      margin-bottom: 1rem;
      letter-spacing: -1px;
    }

    p {
      font-size: 1.05rem;
      color: #555;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #1D9E75;
    }

    button {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #1D9E75;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #178a64;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rayzoai</h1>
    <p>Analyze your app's negative reviews and discover what to fix first</p>
    <div class="input-group">
      <input type="text" placeholder="Enter your app name" />
      <button>Analyze</button>
    </div>
  </div>
</body>
</html>
